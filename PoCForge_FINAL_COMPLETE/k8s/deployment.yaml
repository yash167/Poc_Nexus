
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pocforge-api
  template:
    metadata:
      labels:
        app: pocforge-api
    spec:
      containers:
        - name: api
          image: pocforge-api:latest
          ports:
            - containerPort: 8000
